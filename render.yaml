services:
  - type: web
    name: gorgona-medusa
    runtime: node
    repo: https://github.com/vladyn/gorgona-medusa.git
    branch: render-deploy
    plan: standard
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 9000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STORE_CORS
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
